# 个人主页的 Nginx 配置（容器内路径：/etc/nginx/conf.d/default.conf）
#
# 这份配置负责四件事：
#   1) 托管 dist 里的静态文件（SPA 单页兜底到 index.html）
#   2) gzip 压缩：本站 CSS/JS 未压缩约 1.9MB，压缩后约 520KB
#   3) 缓存策略：带 hash 的资源永久缓存、图片 30 天、入口 HTML 不缓存
#   4) 几个基础安全响应头

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ---- 压缩 ----
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/plain text/css text/javascript application/javascript application/json
               application/xml image/svg+xml font/woff2;

    # ---- 带内容 hash 的构建产物：可以永久缓存 ----
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # ---- 图片：文件名不随内容变，用 30 天缓存 ----
    location /images/ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
    }

    # ---- 入口 HTML：绝不能强缓存，否则发新版用户看不到 ----
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # ---- 单页兜底：任何路径都回 index.html（本站只有锚点，没有真实路由） ----
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ---- 基础安全头 ----
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # 隐藏版本号
    server_tokens off;
}
